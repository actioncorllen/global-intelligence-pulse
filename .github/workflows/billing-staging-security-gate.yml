name: billing-staging security gate

# Automated recurrence protection for the billing-staging RLS remediation.
#
# Runs the TIER-1 read-only catalog gate (scripts/security/security_gate_catalog.sql)
# against strateloq-billing-staging using a dedicated LEAST-PRIVILEGE, read-only
# role (security_gate_ro — see scripts/security/provision_ci_gate_role.sql). The
# gate uses only catalog reads (no SET ROLE, no data reads, no RPC execution), so a
# leaked CI credential exposes no business data. It FAILS (non-zero exit) if any
# public table lacks RLS, if anon/authenticated gain unintended access, if the
# member tenant-isolation policy is missing, or if billing RPC grants drift.
#
# The privileged TIER-2 behavioural suite (scripts/security/security_regression_test.sql)
# is NOT run here: it needs an elevated connection and is run via MCP / a protected
# manual job, so administrator credentials are never stored for untrusted CI.
#
# Security properties:
#   * Least privilege — uses the read-only security_gate_ro role only.
#   * No misleading green — if the DB-URL secret is absent on a trusted run, the job
#     FAILS loudly instead of passing with nothing tested.
#   * Untrusted PRs — the job is skipped for pull requests from forks, which never
#     receive secrets (uses `pull_request`, not `pull_request_target`).
#   * Read-only / non-destructive — the SQL makes no changes.
#   * Staging only — the secret points at billing-staging; production is never targeted.
#
# REQUIRED external configuration (one-time, by a repo admin):
#   Repo → Settings → Secrets and variables → Actions → New repository secret:
#     BILLING_STAGING_DB_URL_RO = pooler connection string for security_gate_ro
#     (see scripts/security/provision_ci_gate_role.sql for how to build it).
#   To enforce before merge: Settings → Branches → protect the default branch →
#   Require status checks → add "rls-catalog-gate".

on:
  workflow_dispatch: {}
  push:
    paths:
      - 'supabase/billing-staging/**'
      - 'scripts/security/**'
      - '.github/workflows/billing-staging-security-gate.yml'
  pull_request:
    paths:
      - 'supabase/billing-staging/**'
      - 'scripts/security/**'
      - '.github/workflows/billing-staging-security-gate.yml'

permissions:
  contents: read

jobs:
  rls-catalog-gate:
    runs-on: ubuntu-latest
    # Skip for pull requests originating from forks: they cannot (and must not)
    # receive the staging credential. Same-repo branches, pushes and manual runs proceed.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4

      - name: Require gate credential (no misleading green)
        env:
          DB_URL: ${{ secrets.BILLING_STAGING_DB_URL_RO }}
        run: |
          if [ -z "$DB_URL" ]; then
            echo "::error::BILLING_STAGING_DB_URL_RO is not configured — the security gate cannot run."
            echo "Set the repository secret to the security_gate_ro pooler connection string."
            echo "Failing deliberately so a missing credential never looks like a passing gate."
            exit 1
          fi
          echo "Gate credential present."

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Run Tier-1 read-only catalog security gate
        env:
          DB_URL: ${{ secrets.BILLING_STAGING_DB_URL_RO }}
        run: |
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f scripts/security/security_gate_catalog.sql
